# Avvio: docker compose up -d   ->   http://localhost:8080
# Le impostazioni si cambiano in .env (vedi .env.example).
services:
  converter:
    build:
      context: ./server
      args:
        UID: ${CONVERTER_UID:-1000}
        GID: ${CONVERTER_GID:-1000}
    image: universal-converter:latest
    container_name: universal-converter
    restart: unless-stopped
    ports:
      - "${CONVERTER_BIND:-127.0.0.1}:${CONVERTER_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Europe/Rome}
      MAX_PARALLEL: ${MAX_PARALLEL:-2}
      MAX_QUEUE: ${MAX_QUEUE:-200}
      RETAIN_HOURS: ${RETAIN_HOURS:-6}
      MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-20}
      MAX_OUTPUT_GB: ${MAX_OUTPUT_GB:-50}
      DISABLED_CONVERSIONS: ${DISABLED_CONVERSIONS:-}
    volumes:
      - converter-work:/work
    deploy:
      resources:
        limits:
          cpus: "${CONVERTER_CPUS:-4}"
          memory: ${CONVERTER_MEMORY:-4G}

volumes:
  converter-work:
