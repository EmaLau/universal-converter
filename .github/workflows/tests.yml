name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Programs used by the real-world tests (PDF, archives, audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf poppler-utils ghostscript ocrmypdf tesseract-ocr-eng libarchive-tools ffmpeg graphviz
      - name: Install
        run: pip install -e "server[test]"
      - name: Test
        working-directory: server
        run: pytest -v -rs

  web-page:
    name: Web page (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install
        run: |
          pip install -e "server[test,ui]"
          python -m playwright install --with-deps chromium
      - name: Test the page in Chromium
        working-directory: server
        run: pytest -v -rs tests/test_ui.py

  whisper:
    name: Whisper (live transcription)
    runs-on: ubuntu-24.04
    services:
      whisper:
        image: ghcr.io/speaches-ai/speaches:latest-cpu
        ports: ["8000:8000"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Programs (FFmpeg for the audio, espeak-ng for the test sentence)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
      - name: Install
        run: pip install -e "server[test]"
      - name: Download the tiny model in the transcription service
        run: |
          for i in $(seq 60); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf -X POST http://localhost:8000/v1/models/Systran/faster-whisper-tiny.en
      - name: Transcribe a spoken sentence
        working-directory: server
        env:
          WHISPER_TEST_URL: http://localhost:8000
          WHISPER_TEST_MODEL: Systran/faster-whisper-tiny.en
        run: pytest -v -rs tests/test_whisper_live.py

  nextcloud-app:
    name: Nextcloud app (syntax)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: PHP
        run: find nextcloud-app -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript
        run: node --check nextcloud-app/js/universal_converter.js
      - name: info.xml
        run: python3 -c "import xml.etree.ElementTree as E; E.parse('nextcloud-app/appinfo/info.xml')"
