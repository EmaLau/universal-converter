name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Programs used by the real-world tests (PDF, archives, audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf poppler-utils ghostscript ocrmypdf tesseract-ocr-eng libarchive-tools ffmpeg
      - name: Install
        run: pip install -e "server[test]"
      - name: Test
        working-directory: server
        run: pytest -v -rs

  nextcloud-app:
    name: Nextcloud app (syntax)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: PHP
        run: find nextcloud-app -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript
        run: node --check nextcloud-app/js/universal_converter.js
      - name: info.xml
        run: python3 -c "import xml.etree.ElementTree as E; E.parse('nextcloud-app/appinfo/info.xml')"
