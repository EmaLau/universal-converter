name: Docker image

# Each release tag (v2.1.0, ...) builds the image, runs the self-test inside it and publishes it to
# ghcr.io/emalau/universal-converter with the tags 2.1.0, 2.1 and latest.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/emalau/universal-converter

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          tags: universal-converter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Self-test
        run: |
          docker run -d --name uc -p 8080:8080 universal-converter:ci
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 2; done
          docker exec uc python3 /app/selftest.py
      - name: Logs
        if: failure()
        run: docker logs uc | tail -100
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
