[project]
name = "universal-converter"
version = "2.5.0"
description = "Convertitore di file self-hosted: documenti, immagini, audio, video, ebook, archivi e strumenti PDF"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["fastapi>=0.100", "uvicorn", "python-multipart"]

[project.optional-dependencies]
test = ["pytest", "httpx", "pyyaml", "pymupdf", "python-docx", "python-pptx", "readability-lxml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["converter"]

[tool.setuptools.package-data]
converter = ["static/*.html", "static/*.js", "static/*.png", "static/*.svg", "static/*.webmanifest", "entrypoint.sh"]
