<!doctype html>
<html lang="$lang$">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url%28%23g%29'/%3E%3Cpath d='M17 25h27l-7-7M47 39H20l7 7' stroke='%23fff' stroke-width='5.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
$if(highlighting-css)$
<style>
$highlighting-css$
</style>
$endif$
$for(header-includes)$
$header-includes$
$endfor$
</head>
<body>
<header class="top">
  <a class="brand" href="./">
    <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs><rect width="24" height="24" rx="6" fill="url(#lg)"/><path d="M7 9h8l-2.5-2.5M17 15H9l2.5 2.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Convertitore
  </a>
  <span class="sep">/</span>
  <span class="crumb">$crumb$</span>
  <span class="sp"></span>
  <span class="langs"><a href="docs?lang=it"$if(it)$ class="on"$endif$>IT</a><a href="docs?lang=en"$if(en)$ class="on"$endif$>EN</a></span>
  <a class="cta" href="./">$cta$</a>
</header>
<div class="layout">
  <aside class="side">
    <details class="toc" id="toc" open>
      <summary>$toctitle$</summary>
      $table-of-contents$
    </details>
  </aside>
  <main class="doc">
    <div class="hero">
      <p class="eyebrow">$crumb$</p>
      <h1 class="title">Universal Converter</h1>
      <p class="subtitle">$subtitle$</p>
    </div>
$body$
    <footer class="foot">Universal Converter · <a href="#">$top$</a></footer>
  </main>
</div>
<script>
  // Su schermi piccoli l'indice parte chiuso; evidenzia la sezione che si sta leggendo.
  const toc = document.getElementById('toc');
  if (window.matchMedia('(max-width: 960px)').matches) toc.removeAttribute('open');
  toc.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    if (window.matchMedia('(max-width: 960px)').matches) toc.removeAttribute('open');
  }));
  const links = new Map([...toc.querySelectorAll('a[href^="#"]')].map(a => [a.getAttribute('href').slice(1), a]));
  const obs = new IntersectionObserver(entries => {
    for (const e of entries) if (e.isIntersecting) {
      links.forEach(a => a.classList.remove('active'));
      links.get(e.target.id)?.classList.add('active');
    }
  }, { rootMargin: '-80px 0px -70% 0px' });
  document.querySelectorAll('main.doc section[id]').forEach(s => obs.observe(s));
</script>
</body>
</html>
