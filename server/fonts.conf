<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Universal Converter: caratteri liberi al posto di quelli commerciali piu' usati in Word e PowerPoint.
  Senza questi sostituti LibreOffice usa un carattere qualsiasi, di solito piu' largo: il testo esce dalle
  caselle e le pagine aumentano. Dove esiste si usa un carattere con le stesse misure (Carlito per Calibri,
  Caladea per Cambria, Liberation per Arial/Times/Courier), altrimenti il piu' simile.
  I propri caratteri (anche quelli originali, se se ne ha la licenza) vanno nella cartella FONTS_DIR
  (predefinita /work/fonts): vengono letti all'avvio e hanno la precedenza.
-->
<fontconfig>
  <alias binding="same"><family>Calibri</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Calibri Light</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Cambria</family><accept><family>Caladea</family></accept></alias>
  <alias binding="same"><family>Gill Sans MT</family><accept><family>Gillius ADF</family></accept></alias>
  <alias binding="same"><family>Gill Sans</family><accept><family>Gillius ADF</family></accept></alias>
  <alias binding="same"><family>Gill Sans Nova</family><accept><family>Gillius ADF</family></accept></alias>
  <alias binding="same"><family>Gill Sans MT Condensed</family><accept><family>Gillius ADF Cond</family></accept></alias>
  <alias binding="same"><family>Century Gothic</family><accept><family>URW Gothic</family></accept></alias>
  <alias binding="same"><family>Avant Garde</family><accept><family>URW Gothic</family></accept></alias>
  <alias binding="same"><family>Garamond</family><accept><family>EB Garamond</family></accept></alias>
  <alias binding="same"><family>Adobe Garamond Pro</family><accept><family>EB Garamond</family></accept></alias>
  <alias binding="same"><family>Book Antiqua</family><accept><family>P052</family></accept></alias>
  <alias binding="same"><family>Palatino Linotype</family><accept><family>P052</family></accept></alias>
  <alias binding="same"><family>Palatino</family><accept><family>P052</family></accept></alias>
  <alias binding="same"><family>Bookman Old Style</family><accept><family>URW Bookman</family></accept></alias>
  <alias binding="same"><family>Century Schoolbook</family><accept><family>C059</family></accept></alias>
  <alias binding="same"><family>Century</family><accept><family>C059</family></accept></alias>
  <alias binding="same"><family>Helvetica</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Helvetica Neue</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Arial Narrow</family><accept><family>Liberation Sans Narrow</family></accept></alias>
  <alias binding="same"><family>Segoe UI</family><accept><family>Open Sans</family></accept></alias>
  <alias binding="same"><family>Segoe UI Light</family><accept><family>Open Sans</family></accept></alias>
  <alias binding="same"><family>Tahoma</family><accept><family>DejaVu Sans</family></accept></alias>
  <alias binding="same"><family>Verdana</family><accept><family>DejaVu Sans</family></accept></alias>
  <alias binding="same"><family>Trebuchet MS</family><accept><family>Open Sans</family></accept></alias>
  <alias binding="same"><family>Georgia</family><accept><family>DejaVu Serif</family></accept></alias>
  <alias binding="same"><family>Lucida Console</family><accept><family>DejaVu Sans Mono</family></accept></alias>
  <alias binding="same"><family>Consolas</family><accept><family>DejaVu Sans Mono</family></accept></alias>
  <alias binding="same"><family>Zapf Chancery</family><accept><family>Z003</family></accept></alias>
</fontconfig>
